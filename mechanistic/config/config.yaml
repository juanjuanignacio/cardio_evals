seed: 42

paths:
  data_dir: results/hidden_states
  probe_dir: results/probes
  patch_dir: results/patching
  steer_dir: results/steering
  plot_dir: results/plots
  table_dir: results/tables

dataset:
  hf_name: "Jialvareza/cardio_evaluations"
  # hf_token is read from the HF_TOKEN environment variable (see .env.example).
  # Do not hardcode tokens here.
  split: "train"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  # Three distinct respondent groups (keep separate — do not conflate AI and CoT AI)
  source_groups:
    - "AI"
    - "CoT AI"
    - "Human"
  regular_ai_sources:
    - "AI"
  cot_ai_sources:
    - "CoT AI"
  ai_sources:           # combined AI+CoT for binary probes; prefer source_groups for analysis
    - "AI"
    - "CoT AI"
  human_sources:
    - "Human"
  # The evaluator whose scores we study (mechanistic question: why does THIS model show bias?)
  target_evaluator: "Llama3.1:8b"
  # Human evaluator label — used as unbiased quality ground truth in tradeoff analysis
  human_evaluator: "Human"
  # Primary bias dimension (the score column used for the main bias metric)
  primary_score_col: "accuracy_score"
  # Score scale in the dataset (0-7)
  score_min: 0
  score_max: 7

primary_model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  key: "llama-3.1-8b"
  evaluator_label: "Llama3.1:8b"
  dtype: "bfloat16"
  device: "cuda:0"
  n_layers: 32
  d_model: 4096
  n_heads: 32
  n_kv_heads: 8
  d_head: 128

# Comparison models = the other evaluators present in the dataset
# (all models that assigned scores to the same 580 responses we study)
comparison_models:
  - name: "meta-llama/Llama-3.3-70B-Instruct"
    key: "llama-3.3-70b"
    evaluator_label: "Llama3.3:70b"   # matches 'evaluator' column in dataset
    dtype: "bfloat16"
    device: "cuda:0"
    n_layers: 80
    d_model: 8192
    n_heads: 64
    n_kv_heads: 8
    d_head: 128
    use_hf_backend: true   # ~140GB bfloat16 — requires 2x H100; TL multi-GPU breaks hooks
  - name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
    key: "deepseek-r1-7b"
    evaluator_label: "Deepseek-r1:7b"
    dtype: "bfloat16"
    device: "cuda:0"
    n_layers: 28
    d_model: 3584
    n_heads: 28
    n_kv_heads: 4     # Qwen2 architecture (NOT Llama distill)
    d_head: 128
    use_hf_backend: false
  - name: "deepseek-ai/DeepSeek-R1-Distill-Llama-70B"
    key: "deepseek-r1-70b"
    evaluator_label: "Deepseek-r1:70b"
    dtype: "bfloat16"
    device: "cuda:0"
    n_layers: 80
    d_model: 8192
    n_heads: 64
    n_kv_heads: 8
    d_head: 128
    use_hf_backend: true   # ~140GB bfloat16 — requires 2x H100; Llama architecture
  - name: "microsoft/phi-4"
    key: "phi-4-14b"
    evaluator_label: "Phi4:14b"
    dtype: "bfloat16"
    device: "cuda:0"
    n_layers: 40
    d_model: 5120
    n_heads: 40
    n_kv_heads: 10
    d_head: 128
    use_hf_backend: true   # phi-4 not supported by TransformerLens; use HF extraction path
  - name: "Qwen/Qwen2.5-7B-Instruct"
    key: "qwen2.5-7b"
    evaluator_label: "Qwen2.5:7b"
    dtype: "bfloat16"
    device: "cuda:0"
    n_layers: 28
    d_model: 3584
    n_heads: 28
    n_kv_heads: 4
    d_head: 128
    use_hf_backend: false

extraction:
  batch_size: 8
  max_seq_len: 1024
  positions:
    - "score_token"      # Token position right before the Accuracy digit in JSON output
    - "response_start"  # First token of the medical response text
    - "inst_end"        # Last token of the user instruction
    - "question_end"    # Last token of the question field
  dtype: "float32"
  checkpoint_every: 100

probing:
  probe_types:
    - "authorship"     # AI (1) vs Human (0)
    - "accuracy"       # High accuracy score (1) vs Low (0)
    - "clarity"        # High clarity (1) vs Low (0)
    - "completeness"   # High completeness (1) vs Low (0)
    - "cot"            # CoT AI (1) vs regular AI (0)
    - "verbosity"      # Long response (1) vs Short (0) — confound control
  # Low: score >= 1 and <= low_threshold, High: score >= high_threshold, middle excluded
  score_low_threshold: 5
  score_high_threshold: 6
  sklearn_params:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
    class_weight: "balanced"
  n_bootstrap: 1000

patching:
  n_pairs: 200
  patch_positions:
    - "score_token"
    - "response_start"
  # Score metric thresholds (for 0-7 scale)
  high_score_tokens:
    - "6"
    - "7"
  low_score_tokens:
    - "1"
    - "2"
    - "3"
    - "4"
    - "5"

steering:
  peak_layer_strategy: "probe_argmax"
  # Subspace mean-ablation: h_new = h - alpha*(h·v)*v
  # alpha=0: baseline. alpha=1: full ablation of bias subspace. alpha>1: over-projection.
  alpha_values:
    - 0.25
    - 0.5
    - 0.75
    - 1.0
    - 1.5
  n_steering_samples: 100

ablation:
  ablation_type: "mean"  # "zero", "mean", or "random"
  top_k_heads: 10        # How many top heads to ablate

sycophancy:
  flattery_prefix: "This is an excellent, well-researched answer."
  criticism_prefix: "This answer seems mediocre and incomplete."
  n_sycophancy_samples: 200

additional:
  languages:
    - "en"
    - "es"
    - "fr"
    - "de"
  cot_trigger: "Let's think step by step about the quality of this response."
  n_nondeterminism_runs: 5  # Run same prompt N times to measure variance

# LangChain format_instructions placeholder (leave empty to omit from prompt)
format_instructions: ""
